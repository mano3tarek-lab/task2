<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom styles -->
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">🛍️ Shop</span>
      <button class="btn btn-warning" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">
        🛒 Cart <span id="cartCount" class="badge bg-dark">0</span>
      </button>
    </div>
  </nav>

  <div class="container">

    <!-- Search and filter -->
    <div class="row mb-4">
      <div class="col-md-6 mb-2">
        <input type="text" id="searchInput" class="form-control" placeholder="Search for a product...">
      </div>
      <div class="col-md-6 mb-2">
        <select id="categorySelect" class="form-select">
          <option value="all">All categories</option>
        </select>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2">Loading products...</p>
    </div>

    <!-- Error message -->
    <div id="errorMsg" class="alert alert-danger d-none">Something went wrong while loading the products. Please try again.</div>

    <!-- Products -->
    <div id="productsRow" class="row"></div>

  </div>

  <!-- Cart (slides in from the side) -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartPanel">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title">🛒 Shopping Cart</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column">
      <!-- Items in the cart -->
      <div id="cartItems" class="flex-grow-1"></div>

      <!-- Total -->
      <div class="border-top pt-3">
        <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
          <span>Total:</span>
          <span id="cartTotal" class="text-success">$0</span>
        </div>
        <button id="clearCartBtn" class="btn btn-outline-danger w-100 mb-2">Clear cart</button>
        <button id="checkoutBtn" class="btn btn-success w-100">Checkout</button>
      </div>
    </div>
  </div>

  <!-- Product details modal -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-5 text-center">
              <img id="modalImg" src="" class="img-fluid modal-img">
            </div>
            <div class="col-md-7">
              <span id="modalCategory" class="badge bg-secondary mb-2"></span>
              <p id="modalDesc"></p>
              <p class="fw-bold text-success fs-4" id="modalPrice"></p>
              <p id="modalRating"></p>
              <button id="modalAddBtn" class="btn btn-primary">Add to cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery + Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
